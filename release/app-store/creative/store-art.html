<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Next — App Store artwork</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#fafaf9;color:#121312}
body{font-family:"Helvetica Neue",Arial,sans-serif}
.poster{width:1320px;height:2868px;overflow:hidden;position:relative;background:#fafaf9}
.headline{height:884px;padding:296px 68px 0;text-align:center;display:flex;align-items:center;flex-direction:column}
.eyebrow{margin:0 0 50px;font-size:57px;font-weight:500;line-height:1;letter-spacing:1px;color:#626661}
h1{margin:0;font-size:122px;font-weight:700;line-height:1.07;letter-spacing:-3.5px;max-width:1168px;word-break:keep-all}
h1 span{display:block}
.hero .headline{padding-top:300px}
.hero .serif{font-family:Baskerville,Georgia,serif;font-size:192px;font-weight:400;font-style:italic;line-height:1.08;letter-spacing:-5px;white-space:nowrap}
.hero .sans{font-size:124px;line-height:1.12;letter-spacing:-3.6px;font-weight:700;margin-top:12px;white-space:nowrap}
.ko{font-family:"Apple SD Gothic Neo","Arial Unicode MS",sans-serif}
.ko .eyebrow{font-size:55px;letter-spacing:2px;margin-bottom:53px}
.ko h1{font-size:134px;line-height:1.15;letter-spacing:-4px}
.ko.hero .serif{font-family:AppleMyungjo,"Songti SC",serif;font-size:166px;font-style:normal;letter-spacing:-7px;line-height:1.22}
.ko.hero .sans{font-size:142px;line-height:1.15;letter-spacing:-4.6px;margin-top:16px}
.phone{position:relative;flex:none;width:1092px;height:2356px;margin:auto;border-radius:178px;background:#aaa9a5;padding:13px;box-shadow:0 0 0 3px #676864,inset 0 0 0 4px #d6d5d2}
.phone:before,.phone:after{content:"";position:absolute;width:8px;left:-8px;background:#8e908d;border:2px solid #646763;border-radius:4px}
.phone:before{top:370px;height:74px}.phone:after{top:516px;height:156px}
.glass{position:relative;width:100%;height:100%;border-radius:166px;background:#101211;padding:13px;overflow:hidden;box-shadow:inset 0 0 0 3px #313430}
.screen{position:relative;width:100%;height:100%;border-radius:151px;overflow:hidden;background:#fff}
.screen img{display:block;width:100%;height:auto}
.island{position:absolute;top:31px;left:50%;transform:translateX(-50%);width:276px;height:77px;border-radius:60px;background:#080a09;box-shadow:inset 0 0 0 2px #151714}
</style></head><body><main class="poster" id="poster"><header class="headline" id="headline"></header><div class="phone" aria-label="iPhone showing the actual Next app"><div class="glass"><div class="screen"><img id="screen" alt="Actual Next app screenshot"><div class="island" aria-hidden="true"></div></div></div></div></main>
<script>
const copy={
 'en-US':[
  {hero:['One vision.','One next step.'],file:'Store-02-Home.png'},
  {eyebrow:'FOCUS',title:['One clear step.','Your full attention.'],file:'Store-03-Next-Step.png'},
  {eyebrow:'REFLECT',title:['Keep what','you learn.'],file:'Store-04-Reflection.png'},
  {eyebrow:'JOURNEY',title:['See how far','you’ve come.'],file:'Store-05-Journey.png'}
 ],
 ko:[
  {hero:['하나의 비전','오늘의 한 걸음'],file:'Store-02-Home.png'},
  {eyebrow:'집중',title:['지금은 하나에','집중할 시간'],file:'Store-03-Next-Step.png'},
  {eyebrow:'회고',title:['한 걸음에서','배운 것을 기록해요'],file:'Store-04-Reflection.png'},
  {eyebrow:'여정',title:['지나온 걸음을','돌아보세요'],file:'Store-05-Journey.png'}
 ]
};
const p=new URLSearchParams(location.search),lang=p.get('lang')||'en-US',n=Number(p.get('slide')||0),d=copy[lang][n];
document.documentElement.lang=lang;
document.getElementById('poster').className='poster '+(lang==='ko'?'ko ':'')+(d.hero?'hero':'');
const head=document.getElementById('headline');
if(d.hero){d.hero.forEach((text,i)=>{const e=document.createElement('div');e.className=i?'sans':'serif';e.textContent=text;head.append(e)})}
else{const e=document.createElement('p');e.className='eyebrow';e.textContent=d.eyebrow;head.append(e);const h=document.createElement('h1');d.title.forEach(text=>{const s=document.createElement('span');s.textContent=text;h.append(s)});head.append(h)}
document.getElementById('screen').src='../evidence/release-capture/'+d.file;
</script></body></html>
